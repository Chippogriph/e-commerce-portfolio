<section class="relative hidden sm:block my-8">
  <h2 class="text-center font-bold text-2xl">Liknande produkter</h2>
  <div class="flex justify-center">
    <div
      *ngFor="
        let product of products.slice(currentIndex * 3, (currentIndex + 1) * 3)
      "
      class="w-1/4 px-2"
    >
    <a [routerLink]="'/products/' + product.slug">
      <div class="bg-white p-4 shadow-lg rounded-lg">
        <img
          [src]="product.imageUrl"
          [alt]="product.name"
          class="w-full h-auto rounded-b-md aspect-square object-top object-cover"
        />
        <h3 class="text-lg font-bold mt-4">{{ product.name }}</h3>
        <p>{{ product.price }} kr</p>
      </div>
    </a>
    </div>
  </div>

  <button
    (click)="prev()"
    class="absolute top-1/2 left-72 transform -translate-y-1/2 bg-gray-800 text-white p-2 rounded-full"
  >
    &lt;
  </button>

  <button
    (click)="next()"
    class="absolute top-1/2 right-72 transform -translate-y-1/2 bg-gray-800 text-white p-2 rounded-full"
  >
    &gt;
  </button>
</section>
