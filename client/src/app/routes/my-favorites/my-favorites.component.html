<h2 class="text-3xl text-center font-bold mb-10">Mina favoriter</h2>
<section class="flex flex-col" *ngIf="products.length > 0">
  <app-product-grid
    [products]="products"
    [displayedProducts]="displayedProducts"
    [isLoading]="isLoading"
  />
</section>
<section class="flex flex-col text-center" *ngIf="products.length < 1">
  <h3 class="text-2xl my-10">Tyvärr har du inga favoriter ännu!</h3>
  <i class="fa-regular fa-face-frown text-4xl"></i>
</section>
