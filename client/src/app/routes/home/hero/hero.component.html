<section
  class="rounded-lg p-4 shadow-2xl mb-10 w-full flex flex-col lg:flex-row-reverse"
>
  <div class="w-full lg:flex-1">
    <img
      src={{image}}
      alt="Hero"
      class="rounded-md object-cover w-full"
    />
  </div>
  <div
    class="my-6 flex flex-col items-center justify-center text-center lg:flex-1"
  >
    <h2 class="text-3xl text-center font-bold">
      {{ heading }}
      <br />
      <em>{{companyname}}</em>
    </h2>
    <p class="text-xl text-center text-gray-400">
      {{subheading}}
    </p>
  </div>
</section>
