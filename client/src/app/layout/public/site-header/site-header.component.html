<div class="flex flex-col sm:flex-row w-full">
  <div class="text-center sm:mr-5">
    <a routerLink="/">
      <img
        src="images/Freaky-Fashion-logga-removebg.png"
        alt="Logga för Freaky Fashion"
        class="max-w-[300px] sm:w-full h-auto mx-auto"
    /></a>
  </div>

  <div class="flex items-center my-7 w-full justify-between">
    <form
      (submit)="onSearch($event)"
      class="flex-1 text-3xl sm:text-xl h-11 rounded-md ml-5 border bg-white border-blue-50 shadow max-w-[450px]"
    >
      <input
        type="text"
        [(ngModel)]="searchQuery"
        placeholder="Sök klädesplagg..."
        name="search"
        class="w-full h-full px-2"
      />
      <button type="submit" class="hidden"></button>
    </form>

    <div class="flex items-end ml-6 space-x-6 text-4xl">
      <a
        routerLink="favorites"
        class="fa-solid fa-heart text-[#276B6C] hover:text-[#73B8B7] hover:cursor-pointer"
      ></a>

      <a
        routerLink="cart"
        class="fa-solid fa-basket-shopping text-[#276B6C] hover:text-[#73B8B7] hover:cursor-pointer relative"
        ><span
          class="text-white text-xs font-bold bg-[#EBB67D] rounded-full flex items-center justify-center w-5 h-5 absolute -top-2 -right-2"
          *ngIf="cartCount > 0"
        >
          {{ cartCount }}
        </span></a
      >
      <a
        *ngIf="!(authService.isLoggedIn$ | async)"
        routerLink="login"
        class="fa-solid fa-right-to-bracket text-[#276B6C] hover:text-[#73B8B7] hover:cursor-pointer"
      ></a>
      <a
        *ngIf="authService.isLoggedIn$ | async"
        (click)="logout()"
        class="fa-solid fa-door-closed text-[#276B6C] hover:text-[#73B8B7] hover:cursor-pointer"
      ></a>
    </div>
  </div>
</div>
<app-navbar />
